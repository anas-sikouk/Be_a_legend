                // Finance
                finance: {
                    salary: 45000,
                    bonuses: 0,
                    sponsors: 0,
                    expenses: 18000,
                    balance: 125000,
                },

                // Match events log
                matchEvents: [],

                // Simulation frame
                frame: 0,

                // Dimentions
                w: 800,
                h: 600,
            };

            // ─── PITCH DIMENSIONS ──────────────────────────────────────
            const PITCH = {
                x: 40,
                y: 30,
                w: 720,
                h: 540,
            };

            // ─── PLAYER FACTORY ────────────────────────────────────────
            function createPlayer(id, name, team, position, x, y, color, isUser) {
                const base = {
                    id,
                    name,
                    team, // 'home' or 'away'
                    position,
                    x,
                    y,
                    targetX: x,
                    targetY: y,
                    color: color || '#ffffff',
                    radius: 14,
                    speed: 1.2 + Math.random() * 0.6,
                    stamina: 85 + Math.random() * 15,
                    maxStamina: 100,
                    isUser: !!isUser,
                    hasBall: false,
                    passTarget: null,
                    passTimer: 0,
                    shootTimer: 0,
                    marking: null,
                    state: 'idle', // idle, running, sprinting, walking, pressing
                    direction: Math.random() * Math.PI * 2,
                    rating: 6.0 + Math.random() * 2.0,
                    goals: 0,
                    assists: 0,
                    passes: 0,
                    tackles: 0,
                    interceptions: 0,
                    dribbles: 0,
                    // AI
                    decisionTimer: 0,
                    action: 'idle',
                    homeX: x,
                    homeY: y,
                    // Movement
                    vx: 0,
                    vy: 0,
                };
                return base;
            }

            // ─── INIT TEAMS ─────────────────────────────────────────────
            function initTeams() {
                const players = [];
                const homePositions = getFormationPositions('home', G.formation);
                const awayPositions = getFormationPositions('away', G.formation);

                // Home team
                const homeNames = ['Anas Jr', 'Mbappé', 'Salah', 'De Bruyne', 'Rodri', 'Van Dijk', 'Davies', 'Walker', 'Alisson',
                    'Bellingham', 'Haaland'
                ];
                const homePos = ['ST', 'LW', 'RW', 'CAM', 'CDM', 'CB', 'LB', 'RB', 'GK', 'CM', 'ST'];
                homePositions.forEach((p, i) => {
                    const isUser = i === 0;
                    const name = homeNames[i % homeNames.length] || `Player ${i+1}`;
                    const pos = homePos[i % homePos.length] || 'MID';
                    const col = isUser ? '#fbbf24' : G.homeColor;
                    const pl = createPlayer(i, name, 'home', pos, p.x, p.y, col, isUser);
                    pl.homeX = p.x;
                    pl.homeY = p.y;
                    pl.targetX = p.x;
                    pl.targetY = p.y;
                    // Better attributes for key players
                    if (i < 3) pl.speed = 1.8 + Math.random() * 0.4;
                    if (i > 6) pl.speed = 1.2 + Math.random() * 0.3;
                    players.push(pl);
                });

                // Away team
                const awayNames = ['Martínez', 'Dias', 'Gvardiol', 'Kimmich', 'Musiala', 'Wirtz', 'Saka', 'Odegaard', 'Rice',
                    'Kane', 'Vinicius'
                ];
                const awayPos = ['ST', 'LW', 'RW', 'CAM', 'CDM', 'CB', 'LB', 'RB', 'GK', 'CM', 'ST'];
                awayPositions.forEach((p, i) => {
                    const name = awayNames[i % awayNames.length] || `Away ${i+1}`;
                    const pos = awayPos[i % awayPos.length] || 'MID';
                    const pl = createPlayer(i + 20, name, 'away', pos, p.x, p.y, G.awayColor, false);
                    pl.homeX = p.x;
                    pl.homeY = p.y;
                    pl.targetX = p.x;
                    pl.targetY = p.y;
                    if (i < 3) pl.speed = 1.7 + Math.random() * 0.5;
                    if (i > 6) pl.speed = 1.1 + Math.random() * 0.4;
                    players.push(pl);
                });

                G.players = players;
                G.userIndex = 0; // first player is user

                // Update user card
                const user = G.players[G.userIndex];
                if (user) {
                    playerName.textContent = user.name;
                    playerPos.textContent = user.position;
                    playerAvatar.textContent = user.name.charAt(0);
                    mName.textContent = user.name;
                    mPos.textContent = user.position;
                }
            }

            // ─── FORMATION POSITIONS ──────────────────────────────────
            function getFormationPositions(team, formation) {
                const w = PITCH.w;
                const h = PITCH.h;
                const ox = PITCH.x;
                const oy = PITCH.y;
                const isHome = team === 'home';

                const positions = [];
                const def = (ratio) => {
                    const x = isHome ? ox + w * ratio : ox + w * (1 - ratio);
                    return x;
                };
                const yPos = (ratio) => oy + h * ratio;

                // Default 4-3-3
                let defs = [
                    [0.08, 0.5],
                    [0.20, 0.15],
                    [0.20, 0.35],
                    [0.20, 0.65],
                    [0.20, 0.85],
                    [0.40, 0.25],
                    [0.40, 0.50],
                    [0.40, 0.75],
                    [0.55, 0.10],
                    [0.55, 0.50],
                    [0.55, 0.90]
                ];

                if (formation === '4-4-2') {
                    defs = [
                        [0.08, 0.5],
                        [0.20, 0.15],
                        [0.20, 0.40],
                        [0.20, 0.60],
                        [0.20, 0.85],
                        [0.40, 0.20],
                        [0.40, 0.45],
                        [0.40, 0.55],
                        [0.40, 0.80],
                        [0.55, 0.30],
                        [0.55, 0.70]
                    ];
                } else if (formation === '4-2-3-1') {
                    defs = [
                        [0.08, 0.5],
                        [0.20, 0.15],
                        [0.20, 0.35],
                        [0.20, 0.65],
                        [0.20, 0.85],
                        [0.35, 0.30],
                        [0.35, 0.70],
                        [0.48, 0.20],
                        [0.48, 0.50],
                        [0.48, 0.80],
                        [0.60, 0.50]
                    ];
                }

                // Flip for away
                if (!isHome) {
                    defs = defs.map(([xr, yr]) => [1 - xr, yr]);
                }

                defs.forEach(([xr, yr]) => {
                    positions.push({
                        x: ox + w * xr,
                        y: oy + h * yr
                    });
                });

                return positions;
            }

            // ─── BALL PHYSICS ──────────────────────────────────────────
            function updateBall() {
                const b = G.ball;
                b.x += b.vx;
                b.y += b.vy;
                b.vx *= b.friction;
                b.vy *= b.friction;

                // Boundaries
                const margin = 20;
                if (b.x < PITCH.x + margin) { b.x = PITCH.x + margin;
                    b.vx = -b.vx * 0.5; }
                if (b.x > PITCH.x + PITCH.w - margin) { b.x = PITCH.x + PITCH.w - margin;
                    b.vx = -b.vx * 0.5; }
                if (b.y < PITCH.y + margin) { b.y = PITCH.y + margin;
                    b.vy = -b.vy * 0.5; }
                if (b.y > PITCH.y + PITCH.h - margin) { b.y = PITCH.y + PITCH.h - margin;
                    b.vy = -b.vy * 0.5; }

                // Goal detection
                const gkY1 = PITCH.y + PITCH.h * 0.4;
                const gkY2 = PITCH.y + PITCH.h * 0.6;
                // Home goal (left)
                if (b.x < PITCH.x + 10 && b.y > gkY1 && b.y < gkY2) {
                    // Away scores
                    if (b.vx < 0) {
                        G.awayScore++;
                        addEvent('⚽ GOAL! ' + G.awayTeam + ' scores!', 'goal');
                        b.x = PITCH.x + PITCH.w / 2;
                        b.y = PITCH.y + PITCH.h / 2;
                        b.vx = 0;
                        b.vy = 0;
                        resetPositions();
                        updateScore();
                    }
                }
                // Away goal (right)
                if (b.x > PITCH.x + PITCH.w - 10 && b.y > gkY1 && b.y < gkY2) {
                    if (b.vx > 0) {
                        G.homeScore++;
                        addEvent('⚽ GOAL! ' + G.homeTeam + ' scores!', 'goal');
                        b.x = PITCH.x + PITCH.w / 2;
                        b.y = PITCH.y + PITCH.h / 2;
                        b.vx = 0;
                        b.vy = 0;
                        resetPositions();
                        updateScore();
                    }
                }

                // Ball collision with players
                G.players.forEach(p => {
                    const dx = p.x - b.x;
                    const dy = p.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = p.radius + b.radius + 4;
                    if (dist < minDist && dist > 0.1) {
                        const angle = Math.atan2(dy, dx);
                        const overlap = minDist - dist;
                        b.x -= Math.cos(angle) * overlap * 0.5;
                        b.y -= Math.sin(angle) * overlap * 0.5;
                        // Bounce
                        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                        if (speed > 0.5) {
                            b.vx = Math.cos(angle) * speed * 0.4 + (Math.random() - 0.5) * 0.5;
                            b.vy = Math.sin(angle) * speed * 0.4 + (Math.random() - 0.5) * 0.5;
                        }
                        if (p.isUser && !p.hasBall) {
                            // User can intercept
                            p.interceptions++;
                        }
                        if (!p.isUser && p.team === 'home' && !p.hasBall) {
                            p.tackles++;
                        }
                    }
                });

                // Slow down if near touchline
                if (b.x < PITCH.x + 30 || b.x > PITCH.x + PITCH.w - 30 ||
                    b.y < PITCH.y + 30 || b.y > PITCH.y + PITCH.h - 30) {
                    b.vx *= 0.96;
                    b.vy *= 0.96;
                }
            }

            // ─── PLAYER AI ─────────────────────────────────────────────
            function updatePlayers() {
                const user = G.players[G.userIndex];
                const ball = G.ball;

                G.players.forEach((p, idx) => {
                    if (!p) return;

                    // Stamina recovery / drain
                    if (p.stamina < 100) p.stamina += 0.02;
                    if (p.state === 'sprinting') p.stamina -= 0.08;
                    else if (p.state === 'running') p.stamina -= 0.03;
                    else p.stamina -= 0.005;
                    p.stamina = Math.max(20, Math.min(100, p.stamina));

                    // Energy display for user
                    if (p.isUser) {
                        playerEnergy.textContent = Math.round(p.stamina) + '%';
                        mEnergy.textContent = Math.round(p.stamina) + '%';
                    }

                    // Decision timer
                    p.decisionTimer -= 1 / 60;
                    if (p.decisionTimer <= 0) {
                        p.decisionTimer = 0.5 + Math.random() * 1.0;
                        makeDecision(p);
                    }

                    // Move toward target
                    const dx = p.targetX - p.x;
                    const dy = p.targetY - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    let spd = p.speed * 0.6;
                    if (p.state === 'sprinting') spd = p.speed * 1.2;
                    else if (p.state === 'running') spd = p.speed * 0.9;
                    else if (p.state === 'walking') spd = p.speed * 0.4;

                    // Stamina affects speed
                    const staminaFactor = 0.5 + (p.stamina / 100) * 0.5;
                    spd *= staminaFactor;

                    if (dist > 2) {
                        const angle = Math.atan2(dy, dx);
                        const move = Math.min(dist, spd);
                        p.x += Math.cos(angle) * move;
                        p.y += Math.sin(angle) * move;
                        p.direction = angle;
                        // Slight overshoot correction
                        if (dist < 5) {
                            p.x = p.targetX;
                            p.y = p.targetY;
                        }
                    }

                    // Avoid crowding
                    G.players.forEach(other => {
                        if (other === p) return;
                        const ddx = other.x - p.x;
                        const ddy = other.y - p.y;
                        const ddist = Math.sqrt(ddx * ddx + ddy * ddy);
                        if (ddist < p.radius + other.radius + 8 && ddist > 0.1) {
                            const push = (p.radius + other.radius + 8 - ddist) * 0.15;
                            const ang = Math.atan2(ddy, ddx);
                            p.x -= Math.cos(ang) * push;
                            p.y -= Math.sin(ang) * push;
                        }
                    });

                    // Ball possession
                    if (p.hasBall) {
                        // Move ball with player
                        ball.x = p.x + Math.cos(p.direction) * 20;
                        ball.y = p.y + Math.sin(p.direction) * 20;
                        ball.vx = 0;
                        ball.vy = 0;
                    }

                    // Pass logic
                    if (p.hasBall && p.passTimer > 0) {
                        p.passTimer -= 1 / 60;
                        if (p.passTimer <= 0 && p.passTarget) {
                            // Execute pass
                            const target = p.passTarget;
                            const dx2 = target.x - p.x;
                            const dy2 = target.y - p.y;
                            const d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                            if (d2 > 10) {
                                const power = Math.min(8, d2 / 60);
                                ball.vx = (dx2 / d2) * power + (Math.random() - 0.5) * 0.3;
                                ball.vy = (dy2 / d2) * power + (Math.random() - 0.5) * 0.3;
                                G.passCount++;
                                if (Math.random() < 0.85) G.passComplete++;
                                // Check if pass is to user
                                if (target.isUser) {
                                    addEvent('🎯 Pass to ' + target.name, 'shot');
                                }
                                // Interception chance
                                const interceptChance = 0.05 + Math.random() * 0.08;
                                if (Math.random() < interceptChance) {
                                    // Intercepted
                                    const interceptor = G.players.find(pl =>
                                        pl.team !== p.team &&
                                        Math.abs(pl.x - (p.x + dx2 * 0.5)) < 40 &&
                                        Math.abs(pl.y - (p.y + dy2 * 0.5)) < 40
                                    );
                                    if (interceptor) {
                                        ball.vx *= 0.3;
                                        ball.vy *= 0.3;
                                        interceptor.hasBall = true;
                                        addEvent('🔄 Intercepted by ' + interceptor.name, 'shot');
                                    }
                                }
                            }
                            p.hasBall = false;
                            p.passTarget = null;
                            p.passTimer = 0;
                        }
                    }

                    // Shoot logic
                    if (p.hasBall && p.shootTimer > 0) {
                        p.shootTimer -= 1 / 60;
                        if (p.shootTimer <= 0) {
                            // Shoot toward goal
                            const isHome = p.team === 'home';
                            const goalX = isHome ? PITCH.x + PITCH.w - 10 : PITCH.x + 10;
                            const goalY = PITCH.y + PITCH.h / 2 + (Math.random() - 0.5) * 60;
                            const dx2 = goalX - p.x;
                            const dy2 = goalY - p.y;
                            const d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
                            if (d2 > 20) {
                                const power = 6 + Math.random() * 4;
                                ball.vx = (dx2 / d2) * power + (Math.random() - 0.5) * 1.5;
                                ball.vy = (dy2 / d2) * power + (Math.random() - 0.5) * 1.5;
                                G.shots++;
                                addEvent('💥 Shot by ' + p.name, 'shot');
                                if (p.isUser) {
                                    // User shot
                                    G.userRating += 0.1;
                                    if (Math.random() < 0.15) {
                                        addEvent('🎯 On target!', 'shot');
                                    }
                                }
                            }
                            p.hasBall = false;
                            p.shootTimer = 0;
                        }
                    }

                    // Ball pickup
                    if (!p.hasBall && !ball.vx && !ball.vy) {
                        const dxb = ball.x - p.x;
                        const dyb = ball.y - p.y;
                        const db = Math.sqrt(dxb * dxb + dyb * dyb);
                        if (db < p.radius + ball.radius + 6) {
                            p.hasBall = true;
                            if (p.isUser) {
                                addEvent('⚡ ' + p.name + ' takes possession', 'shot');
                            }
                        }
                    }

                    // User special: tactical influence
                    if (p.isUser) {
                        const mode = G.tacticalMode;
                        if (mode === 'attack') {
                            p.targetX = Math.min(PITCH.x + PITCH.w * 0.75, p.targetX + 2);
                            p.state = 'sprinting';
                        } else if (mode === 'defend') {
                            p.targetX = Math.max(PITCH.x + PITCH.w * 0.25, p.targetX - 2);
                            p.state = 'running';
                        } else if (mode === 'press') {
                            // Press toward ball
                            p.targetX += (ball.x - p.x) * 0.02;
                            p.targetY += (ball.y - p.y) * 0.02;
                            p.state = 'sprinting';
                        } else if (mode === 'conserve') {
                            p.state = 'walking';
                            p.speed = p.speed * 0.7;
                        } else if (mode === 'stay') {
                            p.targetX = p.homeX;
                            p.targetY = p.homeY;
                            p.state = 'walking';
                        } else {
                            // balanced - return to home
                            p.targetX += (p.homeX - p.x) * 0.01;
                            p.targetY += (p.homeY - p.y) * 0.01;
                            if (Math.random() < 0.01) p.state = 'running';
                        }

                        // User rating update
                        if (G.frame % 60 === 0) {
                            const base = 6.5;
                            const perf = (p.passes / 10) * 0.3 + (p.tackles / 5) * 0.2 + (p.interceptions / 5) * 0.2 +
                                (p.goals) * 0.5 + (p.assists) * 0.3;
                            const staminaBonus = p.stamina / 100 * 0.2;
                            G.userRating = Math.min(10, Math.max(4, base + perf + staminaBonus));
                            playerRating.textContent = G.userRating.toFixed(1);
                            mRating.textContent = G.userRating.toFixed(1);
                        }
                    }

                    // Mark opponents
                    if (!p.isUser && p.team === 'home' && p.position === 'CB') {
                        // Mark closest forward
                        const opps = G.players.filter(pl => pl.team === 'away' && (pl.position === 'ST' || pl.position ===
                            'LW' || pl.position === 'RW'));
                        let closest = null;
                        let closestDist = Infinity;
                        opps.forEach(o => {
                            const d = Math.sqrt((o.x - p.x) ** 2 + (o.y - p.y) ** 2);
                            if (d < closestDist) { closestDist = d;
                                closest = o; }
                        });
                        if (closest && closestDist < 150) {
                            p.targetX = closest.x + (Math.random() - 0.5) * 30;
                            p.targetY = closest.y + (Math.random() - 0.5) * 30;
                            p.state = 'running';
                        }
                    }
                });

                // Update ball if no one has it
                let hasPossessor = false;
                G.players.forEach(p => { if (p.hasBall) hasPossessor = true; });
                if (!hasPossessor) {
                    updateBall();
                } else {
                    // Ball moves with possessor
                    const possessor = G.players.find(p => p.hasBall);
                    if (possessor) {
                        ball.x = possessor.x + Math.cos(possessor.direction) * 20;
                        ball.y = possessor.y + Math.sin(possessor.direction) * 20;
                        ball.vx = 0;
                        ball.vy = 0;
                    }
                }
            }

            // ─── AI DECISION MAKING ────────────────────────────────────
            function makeDecision(p) {
                if (p.hasBall) {
                    // Decide to pass or shoot
                    const rand = Math.random();
                    // Find teammates
                    const teammates = G.players.filter(pl => pl.team === p.team && pl !== p);
                    const target = teammates.length > 0 ? teammates[Math.floor(Math.random() * teammates.length)] : null;

                    // Shooting chance
                    const isHome = p.team === 'home';
                    const goalX = isHome ? PITCH.x + PITCH.w : PITCH.x;
                    const distToGoal = Math.abs(p.x - goalX);

                    if (distToGoal < 120 && rand < 0.3 && p.position !== 'GK' && p.position !== 'CB') {
                        // Shoot
                        p.shootTimer = 0.3 + Math.random() * 0.3;
                        p.passTimer = 0;
                        return;
                    }

                    if (target && rand < 0.55) {
                        // Pass
                        p.passTarget = target;
                        p.passTimer = 0.4 + Math.random() * 0.4;
                        p.passes++;
                        return;
                    }

                    // Dribble forward
                    const forward = isHome ? 1 : -1;
                    p.targetX += forward * (20 + Math.random() * 40);
                    p.targetY += (Math.random() - 0.5) * 40;
                    p.state = 'running';
                    if (Math.random() < 0.2) p.dribbles++;
                    return;
                }

                // No ball - positioning
                const isHome = p.team === 'home';
                const ball = G.ball;

                // Move toward ball if nearby
                const dxb = ball.x - p.x;
                const dyb = ball.y - p.y;
                const db = Math.sqrt(dxb * dxb + dyb * dyb);

                if (db < 200 && Math.random() < 0.3) {
                    // Press ball
                    p.targetX = ball.x + (Math.random() - 0.5) * 40;
                    p.targetY = ball.y + (Math.random() - 0.5) * 40;
                    p.state = 'running';
                } else {
                    // Return to home position with some randomness
                    p.targetX = p.homeX + (Math.random() - 0.5) * 40;
                    p.targetY = p.homeY + (Math.random() - 0.5) * 40;
                    p.state = 'walking';
                }

                // Defensive line adjustment
                if (p.position === 'CB' || p.position === 'LB' || p.position === 'RB') {
                    const defLine = isHome ? PITCH.x + PITCH.w * 0.3 : PITCH.x + PITCH.w * 0.7;
                    p.targetX += (defLine - p.targetX) * 0.03;
                }

                // Striker stays forward
                if (p.position === 'ST' || p.position === 'LW' || p.position === 'RW') {
                    const attLine = isHome ? PITCH.x + PITCH.w * 0.7 : PITCH.x + PITCH.w * 0.3;
                    p.targetX += (attLine - p.targetX) * 0.02;
                }
            }

            // ─── RESET POSITIONS ────────────────────────────────────────
            function resetPositions() {
                const homePos = getFormationPositions('home', G.formation);
                const awayPos = getFormationPositions('away', G.formation);
                let hi = 0,
                    ai = 0;
                G.players.forEach(p => {
                    if (p.team === 'home' && hi < homePos.length) {
                        p.x = homePos[hi].x;
                        p.y = homePos[hi].y;
                        p.homeX = homePos[hi].x;
                        p.homeY = homePos[hi].y;
                        p.targetX = homePos[hi].x;
                        p.targetY = homePos[hi].y;
                        hi++;
                    } else if (p.team === 'away' && ai < awayPos.length) {
                        p.x = awayPos[ai].x;
                        p.y = awayPos[ai].y;
                        p.homeX = awayPos[ai].x;
                        p.homeY = awayPos[ai].y;
                        p.targetX = awayPos[ai].x;
                        p.targetY = awayPos[ai].y;
                        ai++;
                    }
                    p.hasBall = false;
                });
                G.ball.x = PITCH.x + PITCH.w / 2;
                G.ball.y = PITCH.y + PITCH.h / 2;
                G.ball.vx = 0;
                G.ball.vy = 0;
            }

            // ─── EVENTS ──────────────────────────────────────────────────
            function addEvent(text, type = 'default') {
                const time = formatTime(G.time);
                const entry = { time, text, type };
                G.events.push(entry);
                G.matchEvents.push(entry);

                // Keep last 50
                if (G.events.length > 50) G.events.shift();

                // Render events
                renderEvents();

                // Update mobile
                if (mEvents) {
                    const el = document.createElement('div');
                    el.textContent = time + ' ' + text;
                    el.style.padding = '2px 0';
                    el.style.borderBottom = '1px solid rgba(255,255,255,0.03)';
                    mEvents.prepend(el);
                    if (mEvents.children.length > 20) mEvents.removeChild(mEvents.lastChild);
                }

                // Social media trigger
                if (type === 'goal') {
                    const post = '⚽ GOAL! ' + text.replace('⚽ GOAL! ', '') + ' 🔥';
                    addSocialPost(post, 20 + Math.floor(Math.random() * 30));
                    G.socialLikes += 15 + Math.floor(Math.random() * 20);
                } else if (type === 'shot') {
                    if (Math.random() < 0.2) {
                        addSocialPost('💥 ' + text, 5 + Math.floor(Math.random() * 10));
                    }
                }
            }

            function renderEvents() {
                eventsList.innerHTML = '';
                // Show latest first
                const show = G.events.slice().reverse().slice(0, 20);
                show.forEach(e => {
                    const div = document.createElement('div');
                    div.className = 'event-item' + (e.type ? ' ' + e.type : '');
                    div.innerHTML = `<span class="time">${e.time}</span><span class="text">${e.text}</span>`;
                    eventsList.appendChild(div);
                });
                if (G.events.length === 0) {
                    const div = document.createElement('div');
                    div.className = 'event-item';
                    div.innerHTML = `<span class="time">00:00</span><span class="text">Match started</span>`;
                    eventsList.appendChild(div);
                }
                eventsList.scrollTop = 0;
            }

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            // ─── SOCIAL MEDIA ──────────────────────────────────────────
            function addSocialPost(text, likes = 0) {
                const post = { text, likes: likes || 5 + Math.floor(Math.random() * 20), time: G.time };
                G.socialPosts.unshift(post);
                if (G.socialPosts.length > 10) G.socialPosts.pop();
                renderSocial();
            }

            function renderSocial() {
                socialFeed.innerHTML = '';
                G.socialPosts.slice(0, 5).forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `<span class="icon">📱</span> ${p.text} <span class="likes">❤️ ${p.likes}</span>`;
                    socialFeed.appendChild(div);
                });
                if (G.socialPosts.length === 0) {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `<span class="icon">📱</span> Welcome to the game! <span class="likes">❤️ 0</span>`;
                    socialFeed.appendChild(div);
                }
            }

            // ─── SCORE UPDATE ──────────────────────────────────────────
            function updateScore() {
                scoreEl.textContent = G.homeScore + ' – ' + G.awayScore;
                // Update stats
                statPossession.textContent = (50 + (G.homeScore - G.awayScore) * 2 + (Math.random() - 0.5) * 4).toFixed(0) + '%';
                statShots.textContent = G.shots;
                const acc = G.passCount > 0 ? (G.passComplete / G.passCount * 100) : 86;
                statPass.textContent = acc.toFixed(0) + '%';
            }

            // ─── MATCH CLOCK ────────────────────────────────────────────
            function updateClock() {
                if (G.paused || G.matchEnded) return;
                G.time += 1 / 60 * G.speed;
                if (G.time > 5400) { // 90 minutes
                    G.time = 5400;
                    G.matchEnded = true;
                    statusEl.textContent = '● Full Time';
                    addEvent('🏁 Full Time! ' + G.homeScore + ' - ' + G.awayScore, 'goal');
                    return;
                }
                if (G.time > 2700 && G.time < 2705 && !G.halfTime) {
                    G.halfTime = true;
                    statusEl.textContent = '⏸ Half Time';
                    addEvent('⏸ Half Time', 'default');
                }
                if (G.time > 2730 && G.halfTime) {
                    G.halfTime = false;
                    statusEl.textContent = '● Second Half';
                    addEvent('▶ Second Half started', 'default');
                }
                clockEl.textContent = formatTime(G.time);
                if (!G.halfTime && !G.matchEnded) {
                    statusEl.textContent = '● Live';
                }
            }

            // ─── RENDER PITCH ───────────────────────────────────────────
            function renderPitch() {
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                // Grass
                const grad = ctx.createRadialGradient(w / 2, h / 2, 50, w / 2, h / 2, w * 0.7);
                grad.addColorStop(0, '#2d6a2d');
                grad.addColorStop(1, '#1a4a1a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Pitch markings
                const px = PITCH.x,
                    py = PITCH.y,
                    pw = PITCH.w,
                    ph = PITCH.h;
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2;

                // Outline
                ctx.strokeRect(px, py, pw, ph);

                // Center line
                ctx.beginPath();
                ctx.moveTo(px + pw / 2, py);
                ctx.lineTo(px + pw / 2, py + ph);
                ctx.stroke();

                // Center circle
                ctx.beginPath();
                ctx.arc(px + pw / 2, py + ph / 2, 50, 0, Math.PI * 2);
                ctx.stroke();

                // Center dot
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(px + pw / 2, py + ph / 2, 4, 0, Math.PI * 2);
                ctx.fill();

                // Penalty areas
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 2;
                // Home (left)
                ctx.strokeRect(px, py + ph * 0.25, 80, ph * 0.5);
                // Away (right)
                ctx.strokeRect(px + pw - 80, py + ph * 0.25, 80, ph * 0.5);

                // Goal areas
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.strokeRect(px, py + ph * 0.38, 30, ph * 0.24);
                ctx.strokeRect(px + pw - 30, py + ph * 0.38, 30, ph * 0.24);

                // Goals
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 3;
                ctx.strokeRect(px - 4, py + ph * 0.40, 8, ph * 0.20);
                ctx.strokeRect(px + pw - 4, py + ph * 0.40, 8, ph * 0.20);

                // Corner arcs
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                const corners = [
                    [px, py, 1],
                    [px + pw, py, 2],
                    [px, py + ph, 3],
                    [px + pw, py + ph, 4]
                ];
                corners.forEach(([cx, cy, q]) => {
                    ctx.beginPath();
                    const start = (q - 1) * Math.PI / 2;
                    const end = start + Math.PI / 2;
                    ctx.arc(cx, cy, 16, start, end);
                    ctx.stroke();
                });

                // Stadium atmosphere - stands
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.fillRect(0, 0, px, h);
                ctx.fillRect(px + pw, 0, w - px - pw, h);
                ctx.fillRect(0, 0, w, py);
                ctx.fillRect(0, py + ph, w, h - py - ph);

                // Crowd dots (simple)
                for (let i = 0; i < 60; i++) {
                    const cx = Math.random() * w;
                    const cy = Math.random() * h;
                    if (cx < px || cx > px + pw || cy < py || cy > py + ph) {
                        ctx.fillStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.1})`;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 1 + Math.random() * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // ─── PLAYERS ────────────────────────────────────────────
                G.players.forEach(p => {
                    if (!p) return;
                    const isUser = p.isUser;
                    const r = p.radius;

                    // Shadow
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 2;

                    // Body
                    const grad2 = ctx.createRadialGradient(p.x - 3, p.y - 3, 2, p.x, p.y, r + 2);
                    grad2.addColorStop(0, isUser ? '#fbbf24' : p.color);
                    grad2.addColorStop(0.7, isUser ? '#eab308' : p.color);
                    grad2.addColorStop(1, isUser ? '#a16207' : '#333');
                    ctx.fillStyle = grad2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Border
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = isUser ? '#fbbf24' : 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = isUser ? 2.5 : 1.5;
                    ctx.stroke();

                    // Glow for user
                    if (isUser) {
                        ctx.shadowColor = 'rgba(251,191,36,0.4)';
                        ctx.shadowBlur = 20;
                        ctx.strokeStyle = 'rgba(251,191,36,0.3)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }

                    // Name
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = isUser ? '#fbbf24' : '#fff';
                    ctx.font = isUser ? 'bold 11px Inter, sans-serif' : '9px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    const label = p.name.length > 10 ? p.name.slice(0, 9) + '…' : p.name;
                    ctx.fillText(label, p.x, p.y - r - 4);

                    // Position badge
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.font = '7px Inter, sans-serif';
                    ctx.textBaseline = 'top';
                    ctx.fillText(p.position || 'MID', p.x, p.y + r + 2);

                    // Star for user
                    if (isUser) {
                        ctx.fillStyle = '#fbbf24';
                        ctx.font = '16px Inter, sans-serif';
                        ctx.textBaseline = 'bottom';
                        ctx.shadowColor = 'rgba(251,191,36,0.5)';
                        ctx.shadowBlur = 12;
                        ctx.fillText('★', p.x, p.y - r - 20);
                        ctx.shadowBlur = 0;
                    }

                    // Ball indicator
                    if (p.hasBall) {
                        ctx.fillStyle = 'rgba(255,255,255,0.15)';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, r + 6, 0, Math.PI * 2);
                        ctx.fill();
                        // Small ball icon
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(p.x + r + 4, p.y - 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Stamina bar
                    const barW = 20;
                    const barH = 3;
                    const barX = p.x - barW / 2;
                    const barY = p.y + r + 12;
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fillRect(barX, barY, barW, barH);
                    const staminaPct = p.stamina / 100;
                    ctx.fillStyle = staminaPct > 0.6 ? '#22c55e' : staminaPct > 0.3 ? '#eab308' : '#ef4444';
                    ctx.fillRect(barX, barY, barW * staminaPct, barH);
                });

                // ─── BALL ──────────────────────────────────────────────
                const b = G.ball;
                ctx.shadowBlur = 16;
                ctx.shadowColor = 'rgba(255,255,255,0.15)';
                // Ball glow
                const grad3 = ctx.createRadialGradient(b.x - 2, b.y - 2, 2, b.x, b.y, b.radius + 4);
                grad3.addColorStop(0, '#ffffff');
                grad3.addColorStop(0.6, '#e0e0e0');
                grad3.addColorStop(1, '#888');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                // Ball pattern
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius * 0.6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(b.x - b.radius * 0.7, b.y);
                ctx.lineTo(b.x + b.radius * 0.7, b.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(b.x, b.y - b.radius * 0.7);
                ctx.lineTo(b.x, b.y + b.radius * 0.7);
                ctx.stroke();

                // ─── SCOREBOARD ON PITCH ──────────────────────────────
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.roundRect ? ctx.roundRect(px + pw / 2 - 70, py + 8, 140, 28, 8) : 0;
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(G.homeTeam.slice(0, 8) + ' ' + G.homeScore + ' - ' + G.awayScore + ' ' + G.awayTeam.slice(0, 8),
                    px + pw / 2, py + 22);

                // Time on pitch
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(px + pw / 2 - 30, py + ph - 30, 60, 20);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(formatTime(G.time), px + pw / 2, py + ph - 20);
            }

            // ─── GAME LOOP ──────────────────────────────────────────────
            function gameLoop() {
                G.frame++;

                if (!G.paused && !G.matchEnded) {
                    updateClock();
                    updatePlayers();
                    updateScore();

                    // Random events
                    if (G.frame % 300 === 0 && !G.paused) {
                        const events = ['Shot on target', 'Corner kick', 'Free kick', 'Good tackle', 'Counter attack'];
                        const evt = events[Math.floor(Math.random() * events.length)];
                        if (Math.random() < 0.3) addEvent('⚡ ' + evt, 'shot');
                    }

                    // Substitution check
                    if (G.frame % 600 === 0 && G.time > 120 && !G.matchEnded) {
                        // Random substitution
                        if (Math.random() < 0.08 && G.userOnPitch) {
                            // User might be subbed
                            const user = G.players[G.userIndex];
                            if (user && user.stamina < 40 && Math.random() < 0.5) {
                                showSubstitution('Manager has decided to substitute you.', 'You\'re coming off.', '😔');
                                G.userOnPitch = false;
                                // Remove user from pitch (hide)
                                user.x = -100;
                                user.y = -100;
                                addEvent('🔄 Substitution: ' + user.name + ' OUT', 'sub');
                            } else if (Math.random() < 0.03) {
                                // Random sub for others
                                const bench = G.players.find(p => !p.isUser && p.team === 'home' && p.stamina < 50);
                                if (bench) {
                                    addEvent('🔄 Substitution: ' + bench.name + ' OUT', 'sub');
                                    bench.x = -100;
                                    bench.y = -100;
                                }
                            }
                        }
                    }

                    // Bring user back on after some time
                    if (!G.userOnPitch && G.frame % 120 === 0 && G.time > 100) {
                        if (Math.random() < 0.01) {
                            G.userOnPitch = true;
                            const user = G.players[G.userIndex];
                            if (user) {
                                user.x = PITCH.x + PITCH.w / 2 + (Math.random() - 0.5) * 100;
                                user.y = PITCH.y + PITCH.h / 2 + (Math.random() - 0.5) * 100;
                                user.homeX = user.x;
                                user.homeY = user.y;
                                user.targetX = user.x;
                                user.targetY = user.y;
                                user.stamina = 70 + Math.random() * 20;
                                showSubstitution('You\'re coming on!', 'Substitution: ' + user.name + ' IN', '💪');
                                addEvent('🔄 Substitution: ' + user.name + ' IN', 'sub');
                            }
                        }
                    }

                    // Auto social posts
                    if (G.frame % 1200 === 0 && !G.paused) {
                        const msgs = ['Training hard 💪', 'Big game tonight! 🔥', 'Love the fans! ❤️', 'Focus on the pitch ⚽',
                            'Ready for the challenge!'
                        ];
                        const msg = msgs[Math.floor(Math.random() * msgs.length)];
                        addSocialPost(msg, 10 + Math.floor(Math.random() * 15));
                    }
                }

                // Render
                renderPitch();
                updateScore();

                // Update mobile
                if (mEvents && G.events.length > 0) {
                    const last = G.events[G.events.length - 1];
                    if (last) {
                        // Just keep the feed updated via the event system
                    }
                }

                requestAnimationFrame(gameLoop);
            }

            // ─── SUBSTITUTION NOTIFICATION ─────────────────────────────
            function showSubstitution(title, desc, detail = '') {
                subTitle.textContent = title;
                subDesc.textContent = desc;
                subDetail.textContent = detail || '';
                subNotif.classList.add('show');
                clearTimeout(subNotif._timer);
                subNotif._timer = setTimeout(() => {
                    subNotif.classList.remove('show');
                }, 4000);
            }

            // ─── CANVAS RESIZE ──────────────────────────────────────────
            function resizeCanvas() {
                const wrap = document.getElementById('pitch-wrap');
                const rect = wrap.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                // Scale context
                ctx.scale(dpr, dpr);
                // Update pitch dimensions in canvas coords
                const w = rect.width;
                const h = rect.height;
                PITCH.x = w * 0.04;
                PITCH.y = h * 0.04;
                PITCH.w = w * 0.92;
                PITCH.h = h * 0.92;
                G.w = w;
                G.h = h;
            }

            // ─── CONTROLS ──────────────────────────────────────────────
            function initControls() {
                // Play/Pause
                document.getElementById('btn-play').addEventListener('click', () => {
                    G.paused = false;
                    statusEl.textContent = '● Live';
                });
                document.getElementById('btn-pause').addEventListener('click', () => {
                    G.paused = !G.paused;
                    statusEl.textContent = G.paused ? '⏸ Paused' : '● Live';
                });

                // Speed
                document.querySelectorAll('.speed').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.speed').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        G.speed = parseFloat(btn.dataset.speed);
                    });
                });

                // Tactical buttons
                document.querySelectorAll('#tactical-buttons button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const action = btn.dataset.action;
                        document.querySelectorAll('#tactical-buttons button').forEach(b => b.classList.remove(
                        'active'));
                        btn.classList.add('active');
                        G.tacticalMode = action;
                        const user = G.players[G.userIndex];
                        if (user) {
                            addEvent('📋 Tactical: ' + action.toUpperCase(), 'default');
                            if (action === 'request') {
                                // Request ball from teammate
                                const teammates = G.players.filter(p => p.team === 'home' && p.hasBall && !p.isUser);
                                if (teammates.length > 0) {
                                    const passer = teammates[Math.floor(Math.random() * teammates.length)];
                                    if (passer) {
                                        passer.passTarget = user;
                                        passer.passTimer = 0.3;
                                        addEvent('📢 ' + user.name + ' requests the ball!', 'shot');
                                    }
                                }
                            }
                        }
                    });
                });

                // Save/Load
                document.getElementById('btn-save').addEventListener('click', saveGame);
                document.getElementById('btn-load').addEventListener('click', loadGame);

                // Resize
                window.addEventListener('resize', () => {
                    resizeCanvas();
                });
                // Initial resize after a tick
                setTimeout(resizeCanvas, 50);
            }

            // ─── SAVE / LOAD ────────────────────────────────────────────
            function saveGame() {
                try {
                    const data = {
                        time: G.time,
                        homeScore: G.homeScore,
                        awayScore: G.awayScore,
                        userRating: G.userRating,
                        players: G.players.map(p => ({
                            id: p.id,
                            name: p.name,
                            team: p.team,
                            position: p.position,
                            x: p.x,
                            y: p.y,
                            homeX: p.homeX,
                            homeY: p.homeY,
                            stamina: p.stamina,
                            goals: p.goals,
                            assists: p.assists,
                            passes: p.passes,
                            tackles: p.tackles,
                            interceptions: p.interceptions,
                            isUser: p.isUser,
                            hasBall: p.hasBall,
                        })),
                        ball: G.ball,
                        events: G.events,
                        socialPosts: G.socialPosts,
                        career: G.career,
                        finance: G.finance,
                        matchEnded: G.matchEnded,
                    };
                    localStorage.setItem('footballLifeSave', JSON.stringify(data));
                    addEvent('💾 Game saved!', 'default');
                } catch (e) {
                    console.error('Save failed', e);
                }
            }

            function loadGame() {
                try {
                    const raw = localStorage.getItem('footballLifeSave');
                    if (!raw) { addEvent('❌ No save found', 'default'); return; }
                    const data = JSON.parse(raw);
                    G.time = data.time || 0;
                    G.homeScore = data.homeScore || 0;
                    G.awayScore = data.awayScore || 0;
                    G.userRating = data.userRating || 7.0;
                    G.matchEnded = data.matchEnded || false;
                    if (data.ball) G.ball = data.ball;
                    if (data.events) { G.events = data.events;
                        renderEvents(); }
                    if (data.socialPosts) { G.socialPosts = data.socialPosts;
                        renderSocial(); }
                    if (data.career) G.career = data.career;
                    if (data.finance) G.finance = data.finance;
                    if (data.players) {
                        data.players.forEach((sp, i) => {
                            if (G.players[i]) {
                                G.players[i].x = sp.x;
                                G.players[i].y = sp.y;
                                G.players[i].homeX = sp.homeX || sp.x;
                                G.players[i].homeY = sp.homeY || sp.y;
                                G.players[i].stamina = sp.stamina || 80;
                                G.players[i].goals = sp.goals || 0;
                                G.players[i].assists = sp.assists || 0;
                                G.players[i].passes = sp.passes || 0;
                                G.players[i].tackles = sp.tackles || 0;
                                G.players[i].interceptions = sp.interceptions || 0;
                                G.players[i].hasBall = sp.hasBall || false;
                                if (sp.isUser) G.userIndex = i;
                            }
                        });
                    }
                    updateScore();
                    clockEl.textContent = formatTime(G.time);
                    playerRating.textContent = G.userRating.toFixed(1);
                    mRating.textContent = G.userRating.toFixed(1);
                    addEvent('📂 Game loaded!', 'default');
                } catch (e) {
                    console.error('Load failed', e);
                    addEvent('❌ Load failed', 'default');
                }
            }

            // ─── INIT ────────────────────────────────────────────────────
            function init() {
                initTeams();
                resetPositions();
                addEvent('⚽ Match started!', 'default');
                addSocialPost('🎮 Starting my career! Let\'s go! 🔥', 42);
                // Set initial user rating
                playerRating.textContent = G.userRating.toFixed(1);
                mRating.textContent = G.userRating.toFixed(1);
                updateScore();
                initControls();

                // Start loop
                gameLoop();

                // Auto save every 30 seconds
                setInterval(() => {
                    if (!G.paused && !G.matchEnded) {
                        saveGame();
                    }
                }, 30000);

                console.log('⚽ Football Life Simulator started!');
                console.log('👤 Player:', G.players[G.userIndex]?.name);
                console.log('🏟️ ' + G.homeTeam + ' vs ' + G.awayTeam);
            }

            // ─── START ──────────────────────────────────────────────────
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
