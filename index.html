<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚽ Football Life Simulator</title>
    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --bg: #0a0e14;
            --surface: rgba(255, 255, 255, 0.06);
            --surface2: rgba(255, 255, 255, 0.10);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f4fa;
            --text2: rgba(255, 255, 255, 0.7);
            --text3: rgba(255, 255, 255, 0.4);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --green: #22c55e;
            --red: #ef4444;
            --gold: #fbbf24;
            --radius: 16px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 8px;
        }

        /* ── APP SHELL ── */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px;
            gap: 8px;
            background: radial-gradient(ellipse at 50% 0%, #141e2a, #0a0e14 70%);
        }

        /* ── TOP BAR ── */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            flex-shrink: 0;
            height: 52px;
        }
        #topbar .brand {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #topbar .brand span {
            color: var(--primary);
        }
        #topbar .match-info {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        #topbar .match-info .score {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 16px;
            border-radius: 8px;
        }
        #topbar .match-info .clock {
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 56px;
            text-align: center;
        }
        #topbar .match-info .status {
            color: var(--text2);
            font-size: 12px;
        }

        /* ── MAIN LAYOUT ── */
        #main {
            display: flex;
            flex: 1;
            gap: 8px;
            min-height: 0;
        }

        /* ── PITCH CONTAINER ── */
        #pitch-wrap {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
            min-width: 0;
            min-height: 0;
        }
        #pitch-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a3a1a;
            cursor: default;
        }

        /* ── PITCH OVERLAY CONTROLS ── */
        #pitch-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: none;
        }
        #pitch-overlay>* {
            pointer-events: auto;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .ctrl-group button {
            background: transparent;
            border: none;
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
        }
        .ctrl-group button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .ctrl-group button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .ctrl-group button.speed {
            font-size: 11px;
            padding: 2px 8px;
        }
        .ctrl-group button.speed.active {
            background: var(--primary);
        }
        .ctrl-group .sep {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* ── TACTICAL QUICK BUTTONS ── */
        #tactical-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        #tactical-buttons button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text2);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        #tactical-buttons button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        #tactical-buttons button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ── SIDE PANEL ── */
        #sidepanel {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        .panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text3);
            margin-bottom: 6px;
        }

        /* ── PLAYER CARD ── */
        #player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        #player-card .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }
        #player-card .avatar .star {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 14px;
            color: var(--gold);
        }
        #player-card .info {
            flex: 1;
            min-width: 0;
        }
        #player-card .info .name {
            font-weight: 700;
            font-size: 15px;
        }
        #player-card .info .detail {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        #player-card .info .detail span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #player-card .rating {
            font-size: 26px;
            font-weight: 900;
            color: var(--gold);
            text-align: right;
            min-width: 48px;
        }

        /* ── EVENTS TIMELINE ── */
        #events-panel {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #events-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding-right: 4px;
        }
        .event-item {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 8px;
            align-items: center;
            border-left: 2px solid transparent;
            animation: fadeSlide 0.3s ease;
        }
        .event-item .time {
            color: var(--text3);
            font-weight: 600;
            min-width: 32px;
            font-size: 10px;
        }
        .event-item .text {
            color: var(--text2);
        }
        .event-item.goal {
            border-left-color: var(--gold);
            background: rgba(251, 191, 36, 0.06);
        }
        .event-item.goal .text {
            color: var(--gold);
            font-weight: 600;
        }
        .event-item.sub {
            border-left-color: var(--primary);
        }
        .event-item.card {
            border-left-color: var(--red);
        }
        .event-item.card .text {
            color: var(--red);
        }
        .event-item.shot {
            border-left-color: var(--green);
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── STATS MINI ── */
        #stats-mini {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            font-size: 11px;
        }
        #stats-mini .stat {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 0;
            border-radius: 6px;
        }
        #stats-mini .stat .val {
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }
        #stats-mini .stat .lbl {
            color: var(--text3);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ── SOCIAL MINI ── */
        #social-mini {
            max-height: 60px;
            overflow: hidden;
        }
        #social-mini .post {
            font-size: 11px;
            color: var(--text2);
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #social-mini .post .icon {
            font-size: 14px;
        }
        #social-mini .post .likes {
            color: var(--text3);
            font-size: 10px;
            margin-left: auto;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 860px) {
            #sidepanel {
                width: 200px;
            }
            #topbar .match-info .score {
                font-size: 18px;
                padding: 0 10px;
            }
            #tactical-buttons button {
                font-size: 8px;
                padding: 2px 6px;
            }
            #player-card .rating {
                font-size: 20px;
                min-width: 36px;
            }
        }
        @media (max-width: 640px) {
            #sidepanel {
                display: none;
            }
            #topbar .match-info .status {
                display: none;
            }
            #pitch-overlay {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .ctrl-group {
                justify-content: center;
                flex-wrap: wrap;
            }
            #tactical-buttons {
                justify-content: center;
            }
            #topbar .brand {
                font-size: 14px;
            }
            #topbar .match-info .clock {
                font-size: 12px;
                min-width: 40px;
            }
        }

        /* ── MOBILE BOTTOM SHEET (hidden by default, shown on small screens) ── */
        #mobile-sheet {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 14, 20, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            padding: 12px 16px;
            max-height: 50vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        #mobile-sheet.open {
            transform: translateY(0);
        }
        #mobile-sheet .handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 0 auto 10px;
        }
        @media (max-width: 640px) {
            #mobile-sheet {
                display: block;
                transform: translateY(100%);
            }
            #mobile-sheet.open {
                transform: translateY(0);
            }
        }

        /* ── SUBSTITUTION NOTIFICATION ── */
        #sub-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            padding: 24px 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 50;
        }
        #sub-notification.show {
            opacity: 1;
        }
        #sub-notification h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        #sub-notification p {
            color: var(--text2);
            font-size: 14px;
        }
        #sub-notification .sub-detail {
            color: var(--gold);
            font-weight: 600;
            font-size: 16px;
            margin-top: 4px;
        }

        /* ── UTILITY ── */
        .text-gold {
            color: var(--gold);
        }
        .text-green {
            color: var(--green);
        }
        .text-red {
            color: var(--red);
        }
        .text-primary {
            color: var(--primary);
        }
        .flex {
            display: flex;
        }
        .items-center {
            align-items: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-1 {
            gap: 4px;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- TOP BAR -->
        <header id="topbar">
            <div class="brand">
                ⚽ <span>LIFE</span> SIM
            </div>
            <div class="match-info">
                <span class="status" id="match-status">● Live</span>
                <span class="clock" id="match-clock">00:00</span>
                <span class="score" id="match-score">0 – 0</span>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
                <button id="btn-save" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;">💾 Save</button>
                <button id="btn-load" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;">📂 Load</button>
            </div>
        </header>

        <!-- MAIN -->
        <div id="main">
            <!-- PITCH -->
            <div id="pitch-wrap">
                <canvas id="pitch"></canvas>
                <!-- Substitution notification -->
                <div id="sub-notification">
                    <h2 id="sub-title">Substitution</h2>
                    <p id="sub-desc">You're coming on!</p>
                    <div class="sub-detail" id="sub-detail"></div>
                </div>
                <!-- Overlay controls -->
                <div id="pitch-overlay">
                    <div class="ctrl-group">
                        <button id="btn-play" class="active">▶</button>
                        <button id="btn-pause">⏸</button>
                        <span class="sep"></span>
                        <button class="speed active" data-speed="1">1×</button>
                        <button class="speed" data-speed="2">2×</button>
                        <button class="speed" data-speed="4">4×</button>
                        <button class="speed" data-speed="8">8×</button>
                    </div>
                    <div id="tactical-buttons">
                        <button data-action="request">📢 Request</button>
                        <button data-action="attack">⚡ Attack</button>
                        <button data-action="defend">🛡 Defend</button>
                        <button data-action="press">🔥 Press</button>
                        <button data-action="stay">📍 Stay</button>
                        <button data-action="run">🏃 Run</button>
                        <button data-action="conserve">💤 Conserve</button>
                    </div>
                </div>
            </div>

            <!-- SIDE PANEL -->
            <div id="sidepanel">
                <!-- Player Card -->
                <div class="panel" id="player-panel">
                    <div class="panel-title">👤 My Player</div>
                    <div id="player-card">
                        <div class="avatar" id="player-avatar">
                            A
                            <span class="star">★</span>
                        </div>
                        <div class="info">
                            <div class="name" id="player-name">Anas Jr</div>
                            <div class="detail">
                                <span>⚽ <span id="player-pos">ST</span></span>
                                <span>🏃 <span id="player-energy">100%</span></span>
                            </div>
                        </div>
                        <div class="rating" id="player-rating">7.4</div>
                    </div>
                </div>

                <!-- Stats Mini -->
                <div class="panel">
                    <div class="panel-title">📊 Match Stats</div>
                    <div id="stats-mini">
                        <div class="stat"><div class="val" id="stat-possession">52%</div><div class="lbl">Possession</div></div>
                        <div class="stat"><div class="val" id="stat-shots">8</div><div class="lbl">Shots</div></div>
                        <div class="stat"><div class="val" id="stat-pass">86%</div><div class="lbl">Pass Acc</div></div>
                    </div>
                </div>

                <!-- Events -->
                <div class="panel" id="events-panel">
                    <div class="panel-title">📋 Match Events</div>
                    <div id="events-list">
                        <div class="event-item"><span class="time">00:00</span><span class="text">Match started</span></div>
                    </div>
                </div>

                <!-- Social Mini -->
                <div class="panel" id="social-mini">
                    <div class="panel-title">📱 Social Feed</div>
                    <div id="social-feed">
                        <div class="post"><span class="icon">👍</span> Great atmosphere tonight! <span class="likes">❤️ 12</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Sheet -->
    <div id="mobile-sheet">
        <div class="handle"></div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:700;">👤 <span id="m-name">Anas Jr</span></span>
                <span style="color:var(--gold);font-weight:900;" id="m-rating">7.4</span>
            </div>
            <div style="display:flex;gap:8px;font-size:12px;color:var(--text2);">
                <span>⚽ <span id="m-pos">ST</span></span>
                <span>🏃 <span id="m-energy">100%</span></span>
            </div>
            <div id="m-events" style="font-size:11px;color:var(--text3);max-height:80px;overflow-y:auto;"></div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  FOOTBALL LIFE SIMULATOR — FULL GAME ENGINE
        // ═══════════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── DOM REFS ──────────────────────────────────────────────
            const canvas = document.getElementById('pitch');
            const ctx = canvas.getContext('2d');

            const $ = id => document.getElementById(id);
            const clockEl = $('match-clock');
            const scoreEl = $('match-score');
            const statusEl = $('match-status');
            const eventsList = $('events-list');
            const playerName = $('player-name');

            const playerEnergy = $('player-energy');
            const playerRating = $('player-rating');
            const playerAvatar = $('player-avatar');
            const statPossession = $('stat-possession');

            const socialFeed = $('social-feed');
            const subNotif = $('sub-notification');
            const subTitle = $('sub-title');
            const subDesc = $('sub-desc');
            const subDetail = $('sub-detail');

            // Mobile refs
            const mName = $('m-name');
            const mRating = $('m-rating');
            const mPos = $('m-pos');
            const mEnergy = $('m-energy');
            const mEvents = $('m-events');

            // ─── STATE ──────────────────────────────────────────────────
            const G = {
                // Match state
                time: 0, // seconds
                speed: 1,
                paused: false,
                matchEnded: false,
                halfTime: false,

                // Score
                homeScore: 0,
                awayScore: 0,

                // Teams
                homeTeam: 'FC United',
                awayTeam: 'City FC',
                homeColor: '#1a6bc4',
                awayColor: '#e11d48',

                // Players
                players: [],
                ball: { x: 400, y: 300, vx: 0, vy: 0, radius: 6, friction: 0.985 },
                userIndex: 0,

                // Stats
                possession: 50,
                shots: 0,
                passAcc: 0,

                // Events
                events: [],
                eventCount: 0,

                // Substitution state
                subActive: false,
                subTimer: 0,
                userOnPitch: true,
                userWarming: false,
                userOnBench: false,

                // Tactical
                tacticalMode: 'balanced', // balanced, attack, defend, press, conserve

                // Formations
                formation: '4-3-3',

                // Player rating
                userRating: 7.4,
                ratingHistory: [],

                // Career
                career: {
                    club: 'FC United',
                    league: 'Premier Division',
                    position: 'ST',
                    overall: 78,
                    age: 22,
                    goals: 0,
                    assists: 0,
                    apps: 0,
                    morale: 75,
                    fitness: 92,
                    reputation: 60,
                    followers: 1240,
                    money: 125000,
                    contractYears: 3,
                },

                // Social
                socialPosts: [],
