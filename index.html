<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Football Life</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top right,#123d55 0%,transparent 35%),
        radial-gradient(circle at bottom left,#101b3c 0%,transparent 40%),
        #050b14;
    color:#fff;
    min-height:100vh;
}

button,input,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    min-height:100vh;
}

/* =========================
   GENERAL
========================= */

.hidden{
    display:none !important;
}

.screen{
    min-height:100vh;
}

.container{
    width:min(1200px,94%);
    margin:auto;
}

.card{
    background:rgba(14,25,40,.92);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.card h2{
    margin-bottom:15px;
}

.title{
    font-size:30px;
    font-weight:900;
}

.subtitle{
    color:#94a9bc;
    margin-top:7px;
}

.btn{
    border:none;
    border-radius:13px;
    padding:13px 18px;
    color:white;
    background:linear-gradient(135deg,#00b894,#008f75);
    font-weight:800;
    transition:.2s;
    margin:4px;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn.blue{
    background:linear-gradient(135deg,#287cff,#1452c7);
}

.btn.gold{
    background:linear-gradient(135deg,#f5b942,#d98a00);
}

.btn.red{
    background:linear-gradient(135deg,#ff5252,#b91c1c);
}

.btn.gray{
    background:#263648;
}

.btn.purple{
    background:linear-gradient(135deg,#9b59ff,#5b20a8);
}

input,select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #26384c;
    background:#0a1523;
    color:white;
    outline:none;
    margin-top:7px;
}

label{
    display:block;
    margin-bottom:14px;
    color:#c8d4df;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.grid3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.stat{
    background:#0a1523;
    border-radius:15px;
    padding:15px;
    border:1px solid rgba(255,255,255,.05);
}

.stat small{
    color:#8ea0b0;
}

.stat strong{
    display:block;
    font-size:25px;
    margin-top:5px;
}

.progress{
    height:9px;
    background:#182636;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.progress span{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#00d2a0,#2c9cff);
    border-radius:20px;
}

/* =========================
   START
========================= */

.start{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 0;
}

.start-box{
    width:min(700px,95%);
    background:rgba(10,20,34,.96);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:48px;
    font-weight:1000;
    margin-bottom:5px;
    background:linear-gradient(90deg,#00e0ad,#36a1ff);
    -webkit-background-clip:text;
    color:transparent;
}

.logo-sub{
    text-align:center;
    color:#8ca1b4;
    margin-bottom:30px;
}

.avatar-preview{
    width:110px;
    height:110px;
    margin:0 auto 20px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    background:linear-gradient(135deg,#00b894,#1565c0);
    border:5px solid #172a3d;
}

/* =========================
   GAME HEADER
========================= */

.game-header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(5,12,22,.96);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.header-inner{
    width:min(1200px,94%);
    margin:auto;
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.player-mini{
    display:flex;
    align-items:center;
    gap:12px;
}

.mini-avatar{
    width:45px;
    height:45px;
    background:linear-gradient(135deg,#00b894,#1269c9);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
}

.player-mini b{
    display:block;
}

.player-mini small{
    color:#8da0b1;
}

.money{
    color:#4dffbd;
    font-weight:bold;
}

/* =========================
   NAVIGATION
========================= */

.nav{
    position:sticky;
    bottom:0;
    z-index:60;
    background:rgba(5,12,22,.98);
    border-top:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    width:min(1200px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(6,1fr);
}

.nav button{
    background:none;
    color:#8093a6;
    border:none;
    padding:11px 3px;
    font-size:11px;
}

.nav button.active{
    color:#00d7a5;
}

.nav-icon{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

/* =========================
   CONTENT
========================= */

.content{
    padding:25px 0 100px;
}

.hero{
    background:
        linear-gradient(120deg,rgba(0,184,148,.22),rgba(29,93,160,.18)),
        #0c1929;
    border-radius:24px;
    padding:25px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,.08);
}

.hero h1{
    font-size:32px;
}

.hero p{
    color:#91a5b7;
    margin-top:7px;
}

.rating-big{
    font-size:70px;
    font-weight:1000;
    line-height:1;
    margin:15px 0;
    color:#4dffbd;
}

.position-badge{
    display:inline-block;
    background:#152c42;
    padding:7px 13px;
    border-radius:20px;
    color:#67b6ff;
    font-weight:bold;
}

/* =========================
   DASHBOARD
========================= */

.dashboard-top{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:16px;
}

.match-box{
    background:
        radial-gradient(circle at center,#173a4e,transparent 65%),
        #0b1827;
    text-align:center;
}

.match-vs{
    font-size:28px;
    font-weight:900;
    margin:15px 0;
}

.team{
    font-weight:bold;
}

.big-score{
    font-size:40px;
    font-weight:1000;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:500px;
}

th,td{
    padding:11px 8px;
    border-bottom:1px solid rgba(255,255,255,.06);
    text-align:center;
}

th{
    color:#8ea1b2;
    font-size:12px;
}

tr.me{
    background:rgba(0,210,160,.09);
}

/* =========================
   EVENTS
========================= */

.event{
    padding:14px;
    border-radius:14px;
    background:#0a1523;
    border-right:4px solid #00c896;
    margin-bottom:10px;
}

.event.red{
    border-right-color:#ff5252;
}

.event.gold{
    border-right-color:#f4b63e;
}

.event.blue{
    border-right-color:#4c9aff;
}

/* =========================
   PLAYER CARD
========================= */

.player-card{
    display:flex;
    gap:20px;
    align-items:center;
}

.player-face{
    width:110px;
    height:110px;
    flex-shrink:0;
    border-radius:25px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    background:linear-gradient(135deg,#183d55,#14205b);
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:min(600px,100%);
    max-height:90vh;
    overflow:auto;
    background:#0b1726;
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:22px;
}

/* =========================
   NOTIFICATION
========================= */

#toast{
    position:fixed;
    top:85px;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    opacity:0;
    z-index:200;
    background:#122438;
    border:1px solid rgba(255,255,255,.1);
    padding:13px 20px;
    border-radius:14px;
    transition:.3s;
    pointer-events:none;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){
    .grid,
    .grid3,
    .dashboard-top{
        grid-template-columns:1fr;
    }

    .title{
        font-size:25px;
    }

    .logo{
        font-size:39px;
    }

    .start-box{
        padding:20px;
    }

    .header-inner{
        min-height:64px;
    }

    .player-mini{
        font-size:13px;
    }

    .money{
        font-size:12px;
    }

    .player-card{
        align-items:flex-start;
    }
}
</style>
</head>

/* =========================================================
   STATE
========================================================= */

let state = null;

function defaultState(){
    return {
        started:false,

        player:{
            name:"",
            nationality:"المغرب",
            age:17,
            position:"ST",

        socialFollowers:100,
        mediaHeat:0,
        lastMatch:null,
        pendingChoice:null
    };
}

/* =========================================================
   STORAGE
========================================================= */

function saveGame(){
    try{
        localStorage.setItem("football_life_save",JSON.stringify(state));
        toast("تم حفظ اللعبة ✓");
    }catch(e){
        toast("تعذر الحفظ");
    }
}

function loadGame(){
    try{
        const raw=localStorage.getItem("football_life_save");

        if(!raw){
            toast("لا توجد لعبة محفوظة");
            return false;
        }

        const loaded=JSON.parse(raw);

        if(!loaded || !loaded.player){
            throw new Error("bad save");
        }

        state=loaded;
        ensureState();
        renderGame();
        toast("تم تحميل اللعبة ✓");
        return true;

    }catch(e){
        localStorage.removeItem("football_life_save");
        toast("ملف الحفظ تالف وتم تجاهله");
        return false;
    }
}

function ensureState(){
    const d=defaultState();

    state.player={...d.player,...(state.player||{})};
    state.season={...d.season,...(state.season||{})};

    if(!Array.isArray(state.events))state.events=[];
    if(!Array.isArray(state.offers))state.offers=[];
    if(!Array.isArray(state.standings))state.standings=[];
    if(!Array.isArray(state.transferHistory))state.transferHistory=[];
    if(!Array.isArray(state.trophies))state.trophies=[];
}

/* =========================================================
   UTILITIES
========================================================= */

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function clamp(n,min,max){
    return Math.max(min,Math.min(max,n));
}

function money(n){
    return Number(n||0).toLocaleString("en-US")+" €";
}

function toast(text){
    const el=document.getElementById("toast");

    if(!el)return;

    el.textContent=text;
    el.classList.add("show");

    clearTimeout(window.__toastTimer);

    window.__toastTimer=setTimeout(()=>{
        el.classList.remove("show");
    },2200);
}

function addEvent(text,type=""){
    state.events.unshift({
        text:text,
        week:state.season.week,
        year:state.season.year,
        type:type
    });

    if(state.events.length>40){
        state.events=state.events.slice(0,40);
    }
}

function avgAbility(){
    const p=state.player;

    return Math.round(
        (p.pace+p.shooting+p.passing+p.dribbling+p.defending+p.physical)/6
    );
}

function updateRating(){
    const p=state.player;

    let base=avgAbility();

    if(p.position==="GK"){
        base=Math.round((p.defending+p.physical+p.passing+p.pace)/4);
    }

    p.rating=clamp(base,40,99);
}

function randomClub(league){
    const arr=leagues[league].clubs;
    return arr[rand(0,arr.length-1)];
}

function getClubStrength(){
    const p=state.player;

    return clamp(
        p.rating +
        p.morale/15 +
        p.fitness/20 +
        p.reputation/25 +
        rand(-4,4),
        35,
        100
    );
}

========================================================= */

                    </p>

    `;
}

/* =========================================================
   START CAREER
========================================================= */

function startCareer(){
    const name=document.getElementById("playerName").value.trim();

    if(!name){
        toast("اكتب اسم اللاعب أولاً");
        return;
    }

    state=defaultState();

    state.started=true;
    state.player.name=name;
    state.player.nationality=document.getElementById("nationality").value;
    state.player.position=document.getElementById("position").value;
    state.player.preferredLeague=document.getElementById("preferredLeague").value;

    generateInitialAbilities();

    renderTrial();
}

function generateInitialAbilities(){
    const p=state.player;

    p.pace=rand(50,70);
    p.shooting=rand(45,70);
    p.passing=rand(45,65);
    p.dribbling=rand(45,70);
    p.defending=rand(25,60);
    p.physical=rand(45,70);

    if(p.position==="GK"){
        p.defending=rand(55,72);
        p.physical=rand(55,72);
    }

    if(["ST","CF","LW","RW"].includes(p.position)){
        p.shooting+=5;

function generateOffers(){

    const p=state.player;

    p.reputation=clamp(p.reputation,0,100);

    let count=rand(3,6);

    const list=[];

    for(let i=0;i<count;i++){

        let league=p.preferredLeague;

        if(Math.random()<.35){
            const keys=Object.keys(leagues);
            league=keys[rand(0,keys.length-1)];
        }

        let strength=rand(
            clamp(p.rating-10,45,85),
            clamp(p.rating+15,55,95)
        );

        const club=randomClub(league);

        const salary=Math.round(
            (p.rating*120+strength*70+rand(0,3000))/100
        )*100;

        const contract=rand(2,5);

        list.push({
            club,
            league,
            strength,
            salary,
            contract,
            bonus:rand(1000,15000)
        });
    }

    state.offers=list;
}

function trainPlayer(){

    if(p.fitness<25){
        toast("لياقتك منخفضة جدًا");
        return;
    }

    const attribute=[
        "pace",
        "shooting",
        "passing",
        "dribbling",
        "defending",
        "physical"
    ][rand(0,5)];

    p[attribute]=clamp(
        p[attribute]+rand(1,3),
        1,
        99
    );

    p.fitness-=rand(8,15);
    p.morale+=rand(-2,4);

    updateRating();

    addEvent(
        `تدربت بشكل جيد وتطور ${attribute}.`,
        "blue"
    );

    renderCareer();
}

/* =========================================================
   MATCH
========================================================= */

function playMatch(){

    const p=state.player;

    if(p.club==="بدون نادٍ"){
        toast("يجب أن توقع مع نادٍ أولًا");
        return;
    }

    if(p.injured){
        toast("أنت مصاب ولا تستطيع اللعب");
        return;
    }

    if(p.suspended){
        toast("أنت موقوف");
        return;
    }

    if(p.fitness<20){
        toast("لياقتك منخفضة");
        return;
    }

    const opponent=nextOpponent();

    const playerStrength=getClubStrength();
    const opponentStrength=rand(55,92);

    let teamGoals=rand(0,3);
    let oppGoals=rand(0,3);

    if(playerStrength>opponentStrength+10){
        teamGoals=rand(1,4);
    }

    if(playerStrength<opponentStrength-10){
        oppGoals=rand(1,4);
    }

    if(teamGoals===oppGoals){
        // keep draw
    }

    let performance=rand(5,10);

    if(playerStrength>opponentStrength){
        performance+=rand(0,5);
    }

    if(p.morale>80)performance+=2;
    if(p.fitness>85)performance+=2;

    let goals=0;
    let assists=0;

    if(["ST","CF","LW","RW"].includes(p.position)){
        goals=clamp(
            Math.floor((performance-6)/3)+rand(0,1),
            0,
            3
        );

        assists=rand(0,Math.random()<.3?2:1);
    }else{
        assists=rand(0,2);

        if(Math.random()<.18){
            goals=1;
        }
    }

    goals=Math.min(goals,teamGoals);

    if(p.position==="GK"){
        goals=0;
        assists=Math.random()<.08?1:0;
    }

    let matchRating=clamp(
        5.5+
        performance/4+
        goals*1.2+
        assists*.6+
        (teamGoals>oppGoals?0.8:-0.3),
        4,
        10
    );

    p.appearances++;
    p.goals+=goals;
    p.assists+=assists;

    p.careerAppearances++;
    p.careerGoals+=goals;
    p.careerAssists+=assists;

    p.fitness-=rand(10,22);

    if(teamGoals>oppGoals){
        state.season.wins++;
        state.season.points+=3;
        p.morale+=rand(3,7);
        p.reputation+=1;
    }else if(teamGoals===oppGoals){
        state.season.draws++;
        state.season.points+=1;
        p.morale+=1;
    }else{
        state.season.losses++;
        p.morale-=rand(2,5);
    }

    state.season.matchesPlayed++;

    state.season.teamGoals+=teamGoals;
    state.season.teamConceded+=oppGoals;

    /* CARDS */

    let card="لا توجد بطاقات";

    if(Math.random()<.22){
        p.yellow++;
        card="🟨 بطاقة صفراء";

        if(p.yellow%5===0){
            p.suspended=true;
            p.suspensionWeeks=1;

            addEvent(
                "تم إيقافك بسبب تراكم البطاقات الصفراء.",
                "red"
            );
        }
    }

    if(Math.random()<.025){
        p.red++;
        p.suspended=true;
        p.suspensionWeeks=2;
        card="🟥 بطاقة حمراء";

        addEvent(
            "طُردت بالبطاقة الحمراء وتم إيقافك.",
            "red"
        );
    }

    /* INJURY */

    let injury="لا توجد إصابة";

    if(Math.random()<.07){

        p.injured=true;
        p.injuryWeeks=rand(1,6);

        injury="🚑 إصابة";

        addEvent(
            `تعرضت لإصابة وستغيب ${p.injuryWeeks} أسابيع.`,
            "red"
        );
    }

    const result=
        teamGoals>oppGoals?"فوز 🟢":
        teamGoals===oppGoals?"تعادل 🟡":
        "خسارة 🔴";

    state.lastMatch={
        opponent,
        teamGoals,
        oppGoals,
        goals,
        assists,
        rating:matchRating.toFixed(1),
        result,
        card,
        injury
    };

    addEvent(
        `${result} ضد ${opponent}: ${teamGoals}-${oppGoals}. تقييمك ${matchRating.toFixed(1)}`,
        teamGoals>=oppGoals?"blue":"red"
    );

    randomLifeEvent();

    advanceWeek();

    saveSilent();

    showMatchResult();
}

/* =========================================================
   WEEK ADVANCE
========================================================= */

function advanceWeek(){

    const p=state.player;
    const s=state.season;

    s.week++;

    /* salary */

    if(s.week%4===0 && p.club!=="بدون نادٍ"){
        p.money+=p.salary;
        addEvent(`استلمت راتبك الشهري: ${money(p.salary)}.`,"gold");
    }

    /* injury countdown */

    if(p.injured){

        p.injuryWeeks--;

        if(p.injuryWeeks<=0){
            p.injured=false;
            p.injuryWeeks=0;
            p.fitness=70;

            addEvent(
                "تعافيت من الإصابة وعدت للتدريبات.",
                "blue"
            );
        }
    }

    /* suspension */

    if(p.suspended){

        p.suspensionWeeks--;

        if(p.suspensionWeeks<=0){
            p.suspended=false;
            p.suspensionWeeks=0;

            addEvent(
                "انتهى الإيقاف وأصبحت متاحًا للعب.",
                "blue"
            );
        }
    }

    /* natural fitness */

    p.fitness=clamp(p.fitness+rand(2,7),0,100);

    /* random development */

    if(Math.random()<.25 && p.age<30){

        const attrs=[
            "pace",
            "shooting",
            "passing",
            "dribbling",
            "defending",
            "physical"
        ];

        const a=attrs[rand(0,attrs.length-1)];

        p[a]=clamp(p[a]+1,1,99);

        updateRating();
    }

    /* random events */

    if(Math.random()<.15){
        mediaEvent();
    }

    /* national team */

    if(p.age>=18 && !p.nationalTeam && Math.random()<.06){
        nationalTeamCheck();
    }

    /* sponsor */

    if(p.sponsor!=="لا يوجد" && s.week%4===0){
        p.money+=p.sponsorIncome;
    }

    /* season */

    if(s.week>38){
        finishSeason();
    }
}

function randomLifeEvent(){

    const r=Math.random();

    if(r<.03){

        addEvent(
            "أحد أفراد عائلتك يحتاج إلى دعمك. قررت أخذ بعض الوقت معه.",

function initializeStandings(){

    const league=state.player.league;

    state.standings=leagues[league].clubs.map(club=>({
        club,
        p:0,
        w:0,
        d:0,
        l:0,
        gf:0,
        ga:0,
        pts:0
    }));

    syncPlayerStanding();
}

function syncPlayerStanding(){

    if(!state.standings.length)return;

    const mine=state.standings.find(
        x=>x.club===state.player.club
    );

    if(!mine)return;

    mine.p=state.season.matchesPlayed;
    mine.w=state.season.wins;
    mine.d=state.season.draws;
    mine.l=state.season.losses;
    mine.gf=state.season.teamGoals;
    mine.ga=state.season.teamConceded;
    mine.pts=state.season.points;

    state.standings.forEach(x=>{

        if(x.club===state.player.club)return;

        const played=state.season.matchesPlayed;

        x.p=played;

        for(let i=0;i<played;i++){

            const result=rand(0,2);

            if(result===0){
                x.w++;
                x.pts+=3;
            }else if(result===1){
                x.d++;
                x.pts++;
            }else{
                x.l++;
            }

            x.gf+=rand(0,3);
            x.ga+=rand(0,3);
        }
    });

    state.standings.sort((a,b)=>{
        if(b.pts!==a.pts)return b.pts-a.pts;
        return (b.gf-b.ga)-(a.gf-a.ga);
    });

    state.season.leaguePosition=
        state.standings.findIndex(
            x=>x.club===state.player.club
        )+1;
}

function transferRequest(){

    if(p.rating<65){

        return;

    const offers=[];

    for(let i=0;i<4;i++){

        let league=Object.keys(leagues)[
            rand(0,Object.keys(leagues).length-1)
        ];

        let club=randomClub(league);

        if(club===p.club){
            club=randomClub(league);
        }

        offers.push({
            club,
            league,
            salary:Math.round(
                p.salary*(1+rand(10,70)/100)
            ),
            fee:Math.round(
                p.rating*rand(3000,10000)
            )

    showModal(`

        ${offers.map((o,i)=>`

                <h2>${o.club}</h2>

                    ${leagues[o.league].name}

                <button class="btn"
                    onclick='acceptTransfer(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
                    قبول الانتقال
                </button>

            </div>

        `).join("")}

        <button class="btn gray" onclick="closeModal()">
            إغلاق
        </button>
    `);
}

function acceptTransfer(o){

    const p=state.player;

    const oldClub=p.club;

    p.club=o.club;
    p.league=o.league;
    p.salary=o.salary;
    p.contract=rand(3,5);

    state.transferHistory.push({
        year:state.season.year,
        from:oldClub,
        to:o.club,
        fee:o.fee
    });

    addEvent(
        `🔄 انتقلت من ${oldClub} إلى ${o.club}.`,
        "gold"
    );

    initializeStandings();

    closeModal();
    saveSilent();
    renderGame();
}

/* =========================================================
   SEASON
========================================================= */

function finishSeason(){

    const p=state.player;
    const s=state.season;

    if(s.seasonFinished)return;

    s.seasonFinished=true;

    syncPlayerStanding();

    const position=s.leaguePosition;

    let trophyText="";

    if(position===1){

        trophyText="🏆 بطل الدوري";

        state.trophies.push(
            `${s.year} - ${trophyText}`
        );

        p.trophies.push(trophyText);

        addEvent(
            `🏆 ${p.club} توج بطلًا للدوري!`,
            "gold"
        );

    }else if(position<=3){

        addEvent(
            `🥉 أنهى فريقك الموسم في المركز ${position}.`,
            "gold"
        );

    }

    /* awards */

    if(p.goals>=15){

        const award="الحذاء الذهبي";

        p.awards.push(
            `${s.year} - ${award}`
        );

        addEvent(
            `👟 حصلت على ${award}!`,
            "gold"
        );
    }

    if(p.age<=23 && p.goals+p.assists>=15){

        const award="أفضل لاعب شاب";

        p.awards.push(
            `${s.year} - ${award}`
        );

        addEvent(
            `🌟 حصلت على جائزة ${award}.`,
            "gold"
        );
    }

    if(p.rating>=85){

        const award="لاعب الموسم";

        p.awards.push(
            `${s.year} - ${award}`
        );

        addEvent(
            `👑 حصلت على جائزة ${award}!`,
            "gold"
        );
    }

    /* age */

    p.age++;

    s.year++;
    s.week=1;

    s.matchesPlayed=0;
    s.wins=0;
    s.draws=0;
    s.losses=0;
    s.points=0;
    s.teamGoals=0;
    s.teamConceded=0;
    s.seasonFinished=false;

    p.goals=0;
    p.assists=0;

    p.fitness=100;

    p.contract=Math.max(0,p.contract-1);

    p.reputation+=rand(1,5);

    p.potential=clamp(
        p.potential,
        p.rating,
        95
    );

    p.rating=clamp(
        p.rating+(p.age<25?rand(1,3):rand(-1,2)),
        40,
        99
    );

    initializeStandings();

    addEvent(
        `🎉 بدأ موسم جديد. أصبحت في عمر ${p.age}.`,
        "blue"
    );

    checkCareerStage();

    saveSilent();

    showModal(`
        <h2>🎉 نهاية الموسم</h2>

        <p class="subtitle">
            انتهى موسم ${s.year-1}/${s.year}.
        </p>

        <div class="grid">

            <div class="stat">
                <small>المركز</small>
                <strong>${position}</strong>
            </div>

            <div class="stat">
                <small>الأهداف</small>
                <strong>${p.goals}</strong>
            </div>

            <div class="stat">
                <small>التقييم</small>
                <strong>${p.rating}</strong>
            </div>

            <div class="stat">
                <small>العمر</small>
                <strong>${p.age}</strong>
            </div>

        </div>

        <button class="btn" onclick="closeModal();renderGame()">
            بداية الموسم الجديد
        </button>
    `);
}

/* =========================================================
   CAREER STAGES
========================================================= */

function checkCareerStage(){

    const p=state.player;

    if(p.age>=32 && Math.random()<.15){

        addEvent(
            "بدأت تشعر أن السنوات الأخيرة من مسيرتك تقترب.",
            "gold"
        );
    }

    if(p.age>=35){

        addEvent(
            "أصبحت في مرحلة متقدمة من مسيرتك. فكر في مستقبلك بعد الاعتزال.",
            "gold"
        );
    }

    if(p.age>=40){

        retirementCheck();
    }
}

function retirementCheck(){

    const p=state.player;

    if(p.age<35){

        toast("ما زال بإمكانك اللعب لسنوات طويلة");

        return;
    }

    showModal(`
        <h2>🏁 مستقبل المسيرة</h2>

        <p class="subtitle">
            أنت في عمر ${p.age}. اختر ما تريد فعله.
        </p>

        <button class="btn gold"
            onclick="retireAsCoach()">
            🧠 الاعتزال والعمل كمدرب
        </button>

        <button class="btn blue"
            onclick="retireAsAgent()">
            🤝 العمل في إدارة اللاعبين
        </button>

        <button class="btn gray"
            onclick="closeModal()">
            الاستمرار كلاعب
        </button>
    `);
}

function retireAsCoach(){

    closeModal();

    showModal(`
        <h2>🧠 مسيرة المدرب</h2>

        <p>
            انتهت مسيرتك كلاعب وبدأت مرحلة جديدة كمدرب.
        </p>

        <div class="card">
            <h2>${state.player.name}</h2>
            <p class="subtitle">
                مدرب جديد • خبرة لاعب سابق
            </p>
        </div>

        <button class="btn gold" onclick="closeModal()">
            مواصلة
        </button>
    `);

    addEvent(
        "🧠 اعتزلت اللعب وبدأت مسيرتك كمدرب.",
        "gold"
    );
}

function retireAsAgent(){

    closeModal();

    addEvent(
        "🤝 اعتزلت اللعب وبدأت العمل في إدارة اللاعبين.",
        "gold"
    );

    showModal(`
        <h2>🤝 وكيل لاعبين</h2>

        <p>
            استخدمت خبرتك في الملاعب لمساعدة لاعبين جدد.
        </p>

        <button class="btn gold" onclick="closeModal()">
            مواصلة
        </button>
    `);
}

/* =========================================================
   MODAL
========================================================= */

function showModal(content){

    let existing=document.getElementById("modal");

    if(existing)existing.remove();

    const div=document.createElement("div");

    div.id="modal";
    div.className="modal";

    div.innerHTML=`
        <div class="modal-box">
            ${content}
        </div>
    `;

    document.body.appendChild(div);
}

function closeModal(){

    const m=document.getElementById("modal");

    if(m)m.remove();
}

/* =========================================================
   NEW GAME
========================================================= */

function newGameConfirm(){

    showModal(`
        <h2>⚠️ بدء مسيرة جديدة</h2>

        <p class="subtitle">
            سيتم حذف المسيرة الحالية من الجهاز.
        </p>

        <button class="btn red" onclick="confirmNewGame()">
            نعم، ابدأ من جديد
        </button>

        <button class="btn gray" onclick="closeModal()">
            إلغاء
        </button>
    `);
}

function confirmNewGame(){

    localStorage.removeItem("football_life_save");

    state=null;

    closeModal();

    renderStart();
}

/* =========================================================
   SILENT SAVE
========================================================= */

function saveSilent(){

    try{
        localStorage.setItem(
            "football_life_save",
            JSON.stringify(state)
        );
    }catch(e){}
}

/* =========================================================
   BOOT
========================================================= */

function boot(){

    try{

        const raw=localStorage.getItem("football_life_save");

        if(raw){

            const loaded=JSON.parse(raw);

            if(
                loaded &&
                loaded.started &&
                loaded.player
            ){

                state=loaded;

                ensureState();

                if(
                    state.player.club!=="بدون نادٍ" &&
                    (!state.standings || !state.standings.length)
                ){
                    initializeStandings();
                }

                renderGame();

                return;
            }
        }

    }catch(e){

        localStorage.removeItem("football_life_save");

    }

    state=defaultState();

    renderStart();
}

/* =========================================================
   KEYBOARD / SAFETY
========================================================= */

window.addEventListener("error",function(e){

    console.error(e.error || e.message);

});

/* =========================================================
   START
========================================================= */

boot();

</script>
